<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학 레벨 테스트 | 레벨 1~90</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #fff;
    }

    .screen { display: none; width: 100%; max-width: 560px; }
    .screen.active { display: block; }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }

    /* ── INTRO ── */
    .intro-icon { font-size: 3.5rem; text-align: center; margin-bottom: 16px; }

    .intro-title {
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .intro-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .intro-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 36px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.7rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-label {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 5px;
      letter-spacing: 0.3px;
    }

    .avg-notice {
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.55);
      background: rgba(251,191,36,0.08);
      border: 1px solid rgba(251,191,36,0.22);
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 16px;
    }

    .avg-notice strong { color: #fbbf24; }

    .btn-start {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.4);
    }

    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(124,58,237,0.55); }
    .btn-start:active { transform: scale(0.98); }

    /* ── QUIZ ── */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-count, .progress-pct {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 600;
    }

    .progress-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #60a5fa);
      border-radius: 100px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .level-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 22px;
      border: 1.5px solid;
    }

    .tier-1 { background: rgba(74,222,128,0.13); border-color: rgba(74,222,128,0.38); color: #4ade80; }
    .tier-2 { background: rgba(96,165,250,0.13); border-color: rgba(96,165,250,0.38); color: #60a5fa; }
    .tier-3 { background: rgba(251,191,36,0.13); border-color: rgba(251,191,36,0.38); color: #fbbf24; }
    .tier-4 { background: rgba(248,113,113,0.13); border-color: rgba(248,113,113,0.38); color: #f87171; }
    .tier-5 { background: rgba(167,139,250,0.13); border-color: rgba(167,139,250,0.38); color: #a78bfa; }

    .question-box {
      min-height: 110px;
      display: flex;
      align-items: center;
      margin-bottom: 40px;
    }

    .question-text {
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.93);
      transition: opacity 0.25s, transform 0.25s;
    }

    .question-text.fade-out { opacity: 0; transform: translateX(24px); }
    .question-text.fade-in  { opacity: 1; transform: translateX(0); }

    .answer-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn-o, .btn-x {
      padding: 22px 16px 18px;
      border: none;
      border-radius: 18px;
      font-size: 2.2rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-sub {
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.85;
      letter-spacing: 0.3px;
    }

    .btn-o {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      box-shadow: 0 6px 24px rgba(16, 185, 129, 0.35);
    }

    .btn-x {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      color: #fff;
      box-shadow: 0 6px 24px rgba(239, 68, 68, 0.35);
    }

    .btn-o:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 32px rgba(16,185,129,0.5); }
    .btn-x:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 32px rgba(239,68,68,0.5); }
    .btn-o:active, .btn-x:active { transform: scale(0.95); }

    /* ── RESULT ── */
    .result-icon { font-size: 3rem; text-align: center; margin-bottom: 14px; }

    .result-title {
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      color: rgba(255,255,255,0.9);
      margin-bottom: 28px;
    }

    .result-max-box {
      background: rgba(167,139,250,0.1);
      border: 1.5px solid rgba(167,139,250,0.28);
      border-radius: 18px;
      padding: 26px 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .result-max-label {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .result-max-num {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    .result-max-suffix {
      font-size: 0.92rem;
      color: rgba(255,255,255,0.55);
    }

    .result-summary-text {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .result-summary-text strong {
      color: #a78bfa;
    }

    .result-gaps-box {
      background: rgba(248,113,113,0.07);
      border: 1.5px solid rgba(248,113,113,0.22);
      border-radius: 18px;
      padding: 20px 22px;
      margin-bottom: 24px;
    }

    .result-gaps-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #f87171;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .gap-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }

    .gap-tag {
      background: rgba(248,113,113,0.15);
      border: 1px solid rgba(248,113,113,0.32);
      color: #fca5a5;
      padding: 5px 13px;
      border-radius: 100px;
      font-size: 0.79rem;
      font-weight: 700;
    }

    .gap-count {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      border-top: 1px solid rgba(248,113,113,0.15);
      padding-top: 12px;
    }

    .result-no-gaps-box {
      background: rgba(74,222,128,0.07);
      border: 1.5px solid rgba(74,222,128,0.22);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
      color: #4ade80;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .btn-curriculum {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, rgba(96,165,250,0.15), rgba(167,139,250,0.15));
      border: 1.5px solid rgba(96,165,250,0.35);
      color: #93c5fd;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      margin-bottom: 12px;
      box-shadow: 0 4px 18px rgba(96,165,250,0.12);
    }

    .btn-curriculum:hover {
      background: linear-gradient(135deg, rgba(96,165,250,0.25), rgba(167,139,250,0.25));
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(96,165,250,0.22);
    }

    .btn-curriculum-sub {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(147,197,253,0.65);
      letter-spacing: 0.3px;
    }

    .btn-restart {
      width: 100%;
      padding: 16px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.13);
      color: rgba(255,255,255,0.75);
      border-radius: 14px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-restart:hover { background: rgba(255,255,255,0.13); transform: translateY(-1px); }

    /* ── ANIMATION ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim { animation: fadeInUp 0.38s cubic-bezier(0.4,0,0.2,1) both; }
  </style>
</head>
<body>

  <!-- ── INTRO SCREEN ── -->
  <div id="screenIntro" class="screen active">
    <div class="card anim">
      <div class="intro-icon">📐</div>
      <h1 class="intro-title">수학 레벨 테스트</h1>
      <p class="intro-subtitle">레벨 1부터 레벨 90까지<br>내 수학 실력의 공백을 찾아보세요</p>
      <div class="intro-stats">
        <div class="stat-box">
          <div class="stat-num">51</div>
          <div class="stat-label">총 문항</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">90</div>
          <div class="stat-label">최대 레벨</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">O/X</div>
          <div class="stat-label">응답 방식</div>
        </div>
      </div>
      <div class="avg-notice">📊 학생들의 평균 레벨 수준은 <strong>40</strong>입니다</div>
      <button class="btn-start" onclick="startQuiz()">테스트 시작하기 →</button>
    </div>
  </div>

  <!-- ── QUIZ SCREEN ── -->
  <div id="screenQuiz" class="screen">
    <div class="card" style="width:100%">
      <div class="progress-header">
        <span class="progress-count" id="progressCount">1 / 51</span>
        <span class="progress-pct"   id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>

      <div class="level-badge tier-1" id="levelBadge">레벨 1</div>

      <div class="question-box">
        <div class="question-text fade-in" id="questionText"></div>
      </div>

      <div class="answer-btns">
        <button class="btn-o" onclick="answer(true)">
          O <span class="btn-sub">알고 있다</span>
        </button>
        <button class="btn-x" onclick="answer(false)">
          X <span class="btn-sub">모른다</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── RESULT SCREEN ── -->
  <div id="screenResult" class="screen">
    <div class="card anim" style="width:100%">
      <div class="result-icon" id="resultIcon">🎓</div>
      <h2 class="result-title" id="resultTitle">테스트 완료!</h2>

      <div class="result-max-box">
        <div class="result-max-label">당신의 최대 레벨은</div>
        <div class="result-max-num" id="resultMaxNum">--</div>
        <div class="result-max-suffix">입니다</div>
      </div>

      <div class="result-summary-text" id="resultSummaryText"></div>

      <div id="resultGapsArea"></div>

      <a class="btn-curriculum" href="https://blog.naver.com/newbasemat/224337325388" target="_blank" rel="noopener">
        📖 내가 보강해야 할 수학개념 확인하기 &nbsp;»
        <span class="btn-curriculum-sub">레벨 커리큘럼 안내</span>
      </a>

      <button class="btn-restart" onclick="restartQuiz()">↺ &nbsp;다시 테스트하기</button>
    </div>
  </div>

<script>
  const questions = [
    { level:"1",   num:1,  text:"나는 항이 뭔지 설명할 수 있다" },
    { level:"2",   num:2,  text:"나는 인수가 뭔지 설명할 수 있다" },
    { level:"2-2", num:2,  text:"-1을 곱한다는 의미는 수직선 기준으로 대칭하는 것이다" },
    { level:"3",   num:3,  text:"절댓값이 무엇이고, 기호를 보면 뭘 해야 하는지를 안다" },
    { level:"4",   num:4,  text:"나는 제곱근과 절댓값의 관계에 대해서 안다" },
    { level:"4-2", num:4,  text:"√144 는 2초 안에 대답이 가능하다" },
    { level:"5",   num:5,  text:"나는 수의 체계에 대해서 안다" },
    { level:"5-2", num:5,  text:"소수와 합성수의 차이를 설명할 수 있다" },
    { level:"6",   num:6,  text:"다항식과 단항식의 차이를 안다" },
    { level:"6-2", num:6,  text:"빼기꼴이 보이면 합차공식을 의심할 수 있다" },
    { level:"7",   num:7,  text:"나는 방정식과 다항식의 차이점을 안다" },
    { level:"8",   num:8,  text:"나는 함수와 방정식의 차이점을 안다" },
    { level:"9",   num:9,  text:"방정식에서 실근은 함수와 x축과의 교점이라는 사실을 안다" },
    { level:"10",  num:10, text:"이차함수를 언제든 그릴 수 있다" },
    { level:"11",  num:11, text:"각도와 기울기의 관계에 대해 설명할 수 있다" },
    { level:"12",  num:12, text:"삼각형의 3 내각의 합은 180°이다" },
    { level:"13",  num:13, text:"나는 소 삼각형 공식을 알고 왜 그런지 설명할 수 있다" },
    { level:"14",  num:14, text:"RHS가 뭔지 설명할 수 있다" },
    { level:"15",  num:15, text:"나는 무게중심과 닮음을 찾을 수 있다" },
    { level:"16",  num:16, text:"삼각비가 뭔지 안다" },
    { level:"17",  num:17, text:"원주각이 뭔지 안다" },
    { level:"18",  num:18, text:"3.14가 왜 3.14인지 설명할 수 있다" },
    { level:"19",  num:19, text:"항이 3개인 다항식을 완전제곱식하면 그 결과의 공식을 안다" },
    { level:"20",  num:20, text:"항등식에서 미정계수를 구하기 위한 방법 3가지를 안다" },
    { level:"21",  num:21, text:"복이차식을 풀 수 있다" },
    { level:"22",  num:22, text:"허수의 특징을 안다" },
    { level:"23",  num:23, text:"근과 계수와의 관계를 안다" },
    { level:"24",  num:24, text:"중근을 가진다는 건 완전제곱식이라는 소리다" },
    { level:"25",  num:25, text:"나는 역수근을 한 번에 구할 수 있다" },
    { level:"26",  num:26, text:"항등함수와 분수함수가 뭔지 안다" },
    { level:"27",  num:27, text:"원의 방정식을 설명할 수 있다" },
    { level:"28",  num:28, text:"지수함수와 로그함수가 쉽다" },
    { level:"29",  num:29, text:"삼각함수가 무엇인지 안다" },
    { level:"30",  num:30, text:"삼각방정식을 안다" },
    { level:"31",  num:31, text:"대칭성을 사용할 줄 안다" },
    { level:"32",  num:32, text:"삼각부등식을 설명할 수 있다" },
    { level:"33",  num:33, text:"사인법칙과 코사인법칙 공식을 유도할 수 있다" },
    { level:"34",  num:34, text:"삼각함수 킬러문제를 한 번이라도 풀어본 적이 있다" },
    { level:"40",  num:40, text:"나는 등차수열과 등비수열이 뭔지 안다" },
    { level:"47",  num:47, text:"나는 시그마(Σ)가 뭔지 안다" },
    { level:"50",  num:50, text:"극한에 대해서 완벽하게 설명할 수 있다" },
    { level:"51",  num:51, text:"나는 연속성이 얼마나 중요한지 안다" },
    { level:"52",  num:52, text:"미분이 뭔지 안다" },
    { level:"55",  num:55, text:"미분가능성이라는 용어를 안다" },
    { level:"58",  num:58, text:"삼차함수를 그릴 줄 안다" },
    { level:"59",  num:59, text:"4차함수를 잘 그린다" },
    { level:"60",  num:60, text:"다항함수 추론이 얼마나 중요한지 안다" },
    { level:"65",  num:65, text:"정적분이 뭔지 안다" },
    { level:"70",  num:70, text:"나는 쌍곡선에 대해 안다" },
    { level:"80",  num:80, text:"확통이 너무 쉽다" },
    { level:"90",  num:90, text:"킬러문제를 제발 누가 알려줬으면 좋겠다" },
  ];

  let currentIndex = 0;
  let answers = [];
  let transitioning = false;

  function getTier(num) {
    if (num <= 15) return 'tier-1';
    if (num <= 30) return 'tier-2';
    if (num <= 55) return 'tier-3';
    if (num <= 70) return 'tier-4';
    return 'tier-5';
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    el.classList.add('active');
    const card = el.querySelector('.card');
    if (card) { card.classList.remove('anim'); void card.offsetWidth; card.classList.add('anim'); }
  }

  function startQuiz() {
    currentIndex = 0;
    answers = [];
    showScreen('screenQuiz');
    renderQuestion(false);
  }

  function renderQuestion(animate) {
    const q = questions[currentIndex];
    const total = questions.length;
    const pct = Math.round((currentIndex / total) * 100);

    document.getElementById('progressCount').textContent = `${currentIndex + 1} / ${total}`;
    document.getElementById('progressPct').textContent   = `${pct}%`;
    document.getElementById('progressFill').style.width  = `${pct}%`;

    const badge = document.getElementById('levelBadge');
    badge.textContent = `레벨 ${q.level}`;
    badge.className   = `level-badge ${getTier(q.num)}`;

    const qt = document.getElementById('questionText');
    if (animate) {
      qt.classList.remove('fade-in');
      qt.classList.add('fade-out');
      setTimeout(() => {
        qt.textContent = q.text;
        qt.classList.remove('fade-out');
        qt.classList.add('fade-in');
        transitioning = false;
      }, 220);
    } else {
      qt.textContent = q.text;
      qt.classList.add('fade-in');
      transitioning = false;
    }
  }

  function answer(isO) {
    if (transitioning) return;
    transitioning = true;
    answers.push(isO);

    if (currentIndex < questions.length - 1) {
      currentIndex++;
      renderQuestion(true);
    } else {
      transitioning = false;
      showResult();
    }
  }

  function showResult() {
    showScreen('screenResult');

    let maxLevel = 0;
    const gaps = [];

    for (let i = 0; i < questions.length; i++) {
      if (answers[i] === true) {
        if (questions[i].num > maxLevel) maxLevel = questions[i].num;
      } else {
        gaps.push(questions[i].level);
      }
    }

    document.getElementById('resultMaxNum').textContent = maxLevel > 0 ? maxLevel : '0';

    const score = answers.filter(a => a).length;
    const pct   = score / questions.length;

    let icon, title;
    if (pct >= 0.9)      { icon = '🏆'; title = '수학 마스터!'; }
    else if (pct >= 0.7) { icon = '🎓'; title = '대단해요!'; }
    else if (pct >= 0.5) { icon = '📚'; title = '잘 하고 있어요!'; }
    else if (pct >= 0.3) { icon = '✏️'; title = '조금 더 공부해봐요!'; }
    else                  { icon = '🌱'; title = '시작이 반이에요!'; }

    document.getElementById('resultIcon').textContent  = icon;
    document.getElementById('resultTitle').textContent = title;

    // 요약 텍스트 (요청한 형식)
    const summaryEl = document.getElementById('resultSummaryText');
    if (gaps.length === 0) {
      summaryEl.innerHTML = `당신의 최대 레벨은 <strong>레벨 ${maxLevel}</strong>입니다.`;
    } else {
      const gapStr = gaps.map(g => `레벨 ${g}`).join(', ');
      summaryEl.innerHTML =
        `당신의 최대 레벨은 <strong>레벨 ${maxLevel}</strong>입니다.<br>` +
        `하지만 공백이 발생한 부분은 <strong>${gapStr}</strong>&nbsp;총 <strong>${gaps.length}곳</strong>입니다.`;
    }

    // 공백 영역
    const gapsArea = document.getElementById('resultGapsArea');
    if (gaps.length === 0) {
      gapsArea.innerHTML = `<div class="result-no-gaps-box">공백 없음 — 완벽합니다! 🎉</div>`;
    } else {
      const tags = gaps.map(g => `<span class="gap-tag">레벨 ${g}</span>`).join('');
      gapsArea.innerHTML = `
        <div class="result-gaps-box">
          <div class="result-gaps-title">⚠ 공백 레벨 목록</div>
          <div class="gap-tags">${tags}</div>
          <div class="gap-count">총 <strong>${gaps.length}곳</strong>의 공백이 발생했습니다</div>
        </div>`;
    }
  }

  function restartQuiz() {
    showScreen('screenIntro');
  }
</script>
</body>
</html>
